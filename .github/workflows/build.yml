name: Build RBridge v2.0

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build single bundled rbridge.exe
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Upload RBridge v2.0 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbridge-v2-windows-x64
          path: target/x86_64-pc-windows-msvc/release/rbridge.exe
