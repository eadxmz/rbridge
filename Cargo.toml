[package]
name = "rbridge"
version = "2.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
winreg = "0.52"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
